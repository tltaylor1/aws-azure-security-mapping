name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The README table is generated from mapping.csv. This refuses a
      # commit where one moved without the other, which is the only way
      # the two can disagree.
      - run: python3 scripts/render_table.py --check

  doctrine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tltaylor1/build-doctrine
          ref: 3a9e72d874aae4244836e3f877458c639f4faf6e
          path: doctrine
          persist-credentials: false
      - name: no retired project name in active text
        run: python3 doctrine/scripts/check_names.py .
